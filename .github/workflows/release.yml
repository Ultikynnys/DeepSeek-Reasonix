name: Build Windows installer

# The only release workflow that matters: build the Windows installer and
# attach it to a draft GitHub Release on this fork. Plain `v<semver>` tags
# (v0.53.3, ...) trigger it. Nothing is published to npm from this repo —
# the npm publish workflows were removed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.53.3). Required when running manually; the tag must exist on the remote."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: build windows installer
    runs-on: windows-latest
    # secrets.* isn't accessible from step-level if:, so expose presence as a
    # job-level env. Treat "true"/"false" strings as booleans downstream.
    env:
      HAS_WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: windows-x64

      - name: Install root deps
        run: npm ci

      - name: Sync desktop version from tag
        run: node scripts/sync-desktop-version.mjs "${{ steps.tag.outputs.name }}"

      - name: Build CLI bundle (dist/)
        run: npm run build

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Download bundled Node runtime
        working-directory: desktop
        run: npm run bundle:node

      - name: Build & verify desktop frontend
        working-directory: desktop
        shell: bash
        run: |
          npm run build
          test -f dist/index.html
          ls dist/assets/*.js >/dev/null

      # tauri-action signs the bundle whenever the WINDOWS_CERTIFICATE_* env
      # vars are defined — including when they're defined to the empty string,
      # which is what `secrets.UNSET` evaluates to. Gate the signing block on
      # the certificate being non-empty so unsigned builds don't trip
      # `security import` / `signtool` on missing certs.
      - name: Build Tauri bundle (unsigned)
        if: env.HAS_WIN_CERT != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: Reasonix ${{ steps.tag.outputs.name }}
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Build Tauri bundle (signed)
        if: env.HAS_WIN_CERT == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: Reasonix ${{ steps.tag.outputs.name }}
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc
